<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printer Bed Mesh Visualizer</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-hover: #2a2a2a;
      --border: #333333;
      --text: #e0e0e0;
      --text-muted: #9e9e9e;
      --primary: #3b82f6;
      --error: #ef4444;
      
      /* Color scale for mesh */
      --mesh-low: #2563eb;
      --mesh-zero: #ffffff;
      --mesh-high: #dc2626;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 4rem 2rem;
      text-align: center;
      background-color: var(--surface);
      transition: all 0.2s ease;
      cursor: pointer;
      margin-bottom: 2rem;
    }
    
    #drop-zone.dragover {
      border-color: var(--primary);
      background-color: rgba(59, 130, 246, 0.1);
    }
    
    #drop-zone p {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }
    
    #file-input {
      display: none;
    }
    
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background-color: #2563eb;
    }
    
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    
    .tab {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 6px;
    }
    
    .tab:hover {
      background-color: var(--surface);
      color: var(--text);
    }
    
    .tab.active {
      background-color: var(--surface-hover);
      color: var(--text);
    }
    
    .mesh-container {
      display: none;
    }
    
    .mesh-container.active {
      display: block;
    }
    
    .stats-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background-color: var(--surface);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .stat-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }
    
    .visualizer-wrapper {
      position: relative;
      background-color: var(--surface);
      padding: 3rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    
    .mesh-grid {
      display: grid;
      gap: 2px;
      margin: 0 auto;
      background-color: var(--border);
      border: 2px solid var(--border);
    }
    
    .mesh-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 0.5rem;
      font-size: 0.875rem;
      font-family: monospace;
      color: #000;
      font-weight: 600;
      min-width: 60px;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.5);
    }
    
    .corner-label {
      position: absolute;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    
    .corner-tl { top: 1rem; left: 1rem; }
    .corner-tr { top: 1rem; right: 1rem; }
    .corner-bl { bottom: 1rem; left: 1rem; }
    .corner-br { bottom: 1rem; right: 1rem; }
    
    .axis-label {
      position: absolute;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    
    .axis-y {
      left: 0.5rem;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
    }
    
    .axis-x {
      bottom: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
    }
    
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .legend-bar {
      width: 300px;
      height: 12px;
      background: linear-gradient(to right, var(--mesh-low), var(--mesh-zero), var(--mesh-high));
      border-radius: 6px;
    }
    
    .error-msg {
      color: var(--error);
      background-color: rgba(239, 68, 68, 0.1);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bed Mesh Visualizer</h1>
  </header>
  
  <main>
    <div id="drop-zone">
      <p>Drag and drop your <strong>autosave.cfg</strong> here</p>
      <p>or</p>
      <button class="btn" onclick="document.getElementById('file-input').click()">Browse Files</button>
      <input type="file" id="file-input" accept=".cfg,.txt,text/plain" />
    </div>
    
    <div id="error-container" class="error-msg"></div>
    
    <div id="results" style="display: none;">
      <div class="tabs" id="profile-tabs"></div>
      <div id="mesh-containers"></div>
    </div>
  </main>

  <script>
    // Elements
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const errorContainer = document.getElementById('error-container');
    const resultsContainer = document.getElementById('results');
    const tabsContainer = document.getElementById('profile-tabs');
    const meshContainers = document.getElementById('mesh-containers');
    
    // Setup Drag and Drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      
      if (e.dataTransfer.files.length > 0) {
        processFile(e.dataTransfer.files[0]);
      }
    });
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processFile(e.target.files[0]);
      }
    });
    
    function showError(msg) {
      errorContainer.textContent = msg;
      errorContainer.style.display = 'block';
      resultsContainer.style.display = 'none';
    }
    
    function processFile(file) {
      errorContainer.style.display = 'none';
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const content = e.target.result;
          const profiles = parseAutosave(content);
          
          if (profiles.length === 0) {
            showError("No [bed_mesh] profiles found in the file.");
            return;
          }
          
          renderProfiles(profiles);
        } catch (err) {
          showError(`Error processing file: ${err.message}`);
          console.error(err);
        }
      };
      reader.onerror = () => showError("Failed to read file.");
      reader.readAsText(file);
    }
    
    function parseAutosave(content) {
      const lines = content.split('\n');
      const profiles = [];
      let currentProfile = null;
      
      for (let line of lines) {
        line = line.trim();
        if (!line.startsWith('#*#')) continue;
        
        const text = line.substring(3).trim();
        if (text.length === 0) continue;
        
        // Match section e.g. [bed_mesh default]
        const sectionMatch = text.match(/^\[(.*)\]$/);
        if (sectionMatch) {
          const sectionName = sectionMatch[1];
          if (sectionName.startsWith('bed_mesh ')) {
            currentProfile = {
              name: sectionName.substring(9),
              points: [],
              config: {}
            };
            profiles.push(currentProfile);
          } else {
            currentProfile = null;
          }
          continue;
        }
        
        // Inside a bed_mesh section
        if (currentProfile) {
          const eqIndex = text.indexOf('=');
          if (eqIndex !== -1) {
            const key = text.substring(0, eqIndex).trim();
            const val = text.substring(eqIndex + 1).trim();
            
            if (key === 'points') {
              // Parse comma separated floats
              currentProfile.points = val.split(',').map(v => parseFloat(v.trim()));
            } else {
              currentProfile.config[key] = parseFloat(val) || val;
            }
          } else if (text.includes(',')) {
            // Continuation of points on next lines
            const extraPoints = text.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
            if (extraPoints.length > 0) {
              currentProfile.points.push(...extraPoints);
            }
          }
        }
      }
      
      // Clean up profiles
      return profiles.filter(p => p.points.length > 0 && p.config.x_count && p.config.y_count);
    }
    
    function calculateStats(points) {
      let min = Infinity;
      let max = -Infinity;
      let sum = 0;
      
      for (const p of points) {
        if (p < min) min = p;
        if (p > max) max = p;
        sum += p;
      }
      
      const mean = sum / points.length;
      const deviation = max - min;
      
      let varianceSum = 0;
      for (const p of points) {
        varianceSum += Math.pow(p - mean, 2);
      }
      const stdDev = Math.sqrt(varianceSum / points.length);
      
      // Max absolute value for symmetrical color scaling
      const maxAbs = Math.max(Math.abs(min), Math.abs(max));
      
      return { min, max, mean, deviation, stdDev, maxAbs };
    }
    
    function getColorForValue(val, maxAbs) {
      // Scale from -maxAbs (blue) to 0 (white) to +maxAbs (red)
      let normalized = 0;
      if (maxAbs > 0) {
        normalized = val / maxAbs; // -1 to 1
      }
      
      // Interpolate colors
      // Blue: #2563eb (37, 99, 235)
      // White: #ffffff (255, 255, 255)
      // Red: #dc2626 (220, 38, 38)
      
      let r, g, b;
      
      if (normalized < 0) {
        // Interpolate Blue to White
        const t = 1 + normalized; // 0 is Blue, 1 is White
        r = Math.round(37 + (255 - 37) * t);
        g = Math.round(99 + (255 - 99) * t);
        b = Math.round(235 + (255 - 235) * t);
      } else {
        // Interpolate White to Red
        const t = normalized; // 0 is White, 1 is Red
        r = Math.round(255 + (220 - 255) * t);
        g = Math.round(255 + (38 - 255) * t);
        b = Math.round(255 + (38 - 255) * t);
      }
      
      return `rgb(${r}, ${g}, ${b})`;
    }
    
    function renderProfiles(profiles) {
      tabsContainer.innerHTML = '';
      meshContainers.innerHTML = '';
      resultsContainer.style.display = 'block';
      
      profiles.forEach((profile, index) => {
        // Create tab
        const tab = document.createElement('button');
        tab.className = `tab ${index === 0 ? 'active' : ''}`;
        tab.textContent = profile.name;
        tab.onclick = () => switchTab(index);
        tabsContainer.appendChild(tab);
        
        // Create container
        const container = document.createElement('div');
        container.className = `mesh-container ${index === 0 ? 'active' : ''}`;
        container.id = `mesh-${index}`;
        
        // Stats
        const stats = calculateStats(profile.points);
        
        const statsHtml = `
          <div class="stats-panel">
            <div class="stat-card">
              <div class="stat-label">Min Z</div>
              <div class="stat-value" style="color: #60a5fa">${stats.min.toFixed(3)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Max Z</div>
              <div class="stat-value" style="color: #f87171">${stats.max.toFixed(3)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total Deviation</div>
              <div class="stat-value">${stats.deviation.toFixed(3)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Mean Z</div>
              <div class="stat-value">${stats.mean.toFixed(3)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Std Dev</div>
              <div class="stat-value">${stats.stdDev.toFixed(3)}</div>
            </div>
          </div>
        `;
        
        // Heatmap Grid
        const { x_count, y_count, min_x, max_x, min_y, max_y } = profile.config;
        
        let gridHtml = `
        <div class="visualizer-wrapper">
          <div class="corner-label corner-tl">Back-Left (BL)</div>
          <div class="corner-label corner-tr">Back-Right (BR)</div>
          <div class="corner-label corner-bl">Front-Left (FL)</div>
          <div class="corner-label corner-br">Front-Right (FR)</div>
          
          <div class="axis-label axis-y">Y (mm) [${min_y} to ${max_y}]</div>
          <div class="axis-label axis-x">X (mm) [${min_x} to ${max_x}]</div>
          
          <div class="mesh-grid" style="grid-template-columns: repeat(${x_count}, 1fr); width: fit-content;">`;
            
        // Render grid: Klipper stores points from y_min to y_max. 
        // We want y_max (Back) at the top, y_min (Front) at the bottom.
        // So we iterate y from y_count-1 down to 0
        for (let y = y_count - 1; y >= 0; y--) {
          for (let x = 0; x < x_count; x++) {
            const idx = y * x_count + x;
            const val = profile.points[idx];
            
            if (val === undefined) {
               gridHtml += `<div class="mesh-cell" style="background-color: #333;">N/A</div>`;
               continue;
            }
            
            const color = getColorForValue(val, stats.maxAbs);
            // Change text color to dark for better contrast on lighter backgrounds, light on darker backgrounds
            // However, with our palette (blue-white-red), black text is legible on white, red, and blue if they aren't extremely dark.
            // Our #2563eb and #dc2626 are mid-tones, black with white text-shadow works best as defined in CSS.
            gridHtml += `<div class="mesh-cell" style="background-color: ${color};" title="X: ${x}, Y: ${y}\nValue: ${val.toFixed(4)}">${val.toFixed(3)}</div>`;
          }
        }
        
        gridHtml += `</div>
          
          <div class="legend">
            <span style="color: #60a5fa">-${stats.maxAbs.toFixed(3)}</span>
            <div class="legend-bar"></div>
            <span style="color: #f87171">+${stats.maxAbs.toFixed(3)}</span>
          </div>
        </div>`;
        
        container.innerHTML = statsHtml + gridHtml;
        meshContainers.appendChild(container);
      });
    }
    
    function switchTab(index) {
      document.querySelectorAll('.tab').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.mesh-container').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
    }
  </script>
</body>
</html>
